# Builds the desktop installers on GitHub's computers, so nobody needs a Mac or a PC set up for it.
#
# - Push a tag like v0.1.0 (or publish a release with that tag) and the Windows .exe and Mac .dmg
#   are built and attached to that release.
# - Or: Actions tab → "Build desktop installers" → Run workflow, and type a version (like 0.1.0) to
#   build and publish release v0.1.0 in one go. Leave the version empty for a test build only.
#
# The files always have the same names, so these links always give the newest version:
#   https://github.com/nosugarlessice/todopop/releases/latest/download/TODOPOP-windows-setup.exe
#   https://github.com/nosugarlessice/todopop/releases/latest/download/TODOPOP-mac.dmg
#   https://github.com/nosugarlessice/todopop/releases/latest/download/TODOPOP-android.apk
#
# latest.yml (with the Windows installer) is what installed Windows copies read to update themselves.
#
# The Android app is signed with the TODOPOP release key from the repo's secrets
# (Settings → Secrets and variables → Actions): ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD.

name: Build desktop installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like 0.1.0 (leave empty for a test build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            file: |
              desktop/dist/TODOPOP-windows-setup.exe
              desktop/dist/TODOPOP-windows-setup.exe.blockmap
              desktop/dist/latest.yml
          - os: macos-latest
            target: --mac --universal   # one app for both Apple-silicon and Intel Macs
            file: desktop/dist/TODOPOP-mac.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # not signed yet (no Apple / Windows certificate)
      - name: Check the Windows update files are there
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          ls -la dist
          test -f dist/latest.yml && test -f dist/TODOPOP-windows-setup.exe.blockmap
          cat dist/latest.yml
      - uses: actions/upload-artifact@v6
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone-android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: pip install pillow
      - run: python3 prepare.py www
      - run: npx cap add android
      - run: python3 prepare.py native "${{ inputs.version || github.ref_name }}" "${{ github.run_number }}"
      - run: npx cap sync android
      - name: Build
        working-directory: phone-android/android
        run: chmod +x gradlew && ./gradlew assembleRelease assembleDebug --no-daemon
      - name: Sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASING: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.version != '' }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT=android/app/build/outputs/apk
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.p12
            "$BT/zipalign" -p -f 4 $OUT/release/app-release-unsigned.apk aligned.apk
            "$BT/apksigner" sign --ks release.p12 --ks-type PKCS12 --ks-pass env:KS_PASS --ks-key-alias todopop --key-pass env:KS_PASS --out TODOPOP-android.apk aligned.apk
            "$BT/apksigner" verify --print-certs TODOPOP-android.apk | head -3
            rm release.p12
          elif [ "$RELEASING" = "true" ]; then
            echo "::error::The Android signing key isn't set up (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD in the repo's Actions secrets)."; exit 1
          else
            echo "::warning::No signing key: this test build is debug-signed and can't update a released install."
            cp $OUT/debug/app-debug.apk TODOPOP-android.apk
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: installer-android
          path: phone-android/TODOPOP-android.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
          name: ${{ inputs.version != '' && format('TODOPOP {0}', inputs.version) || format('TODOPOP {0}', github.ref_name) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            out/TODOPOP-windows-setup.exe
            out/TODOPOP-windows-setup.exe.blockmap
            out/latest.yml
            out/TODOPOP-mac.dmg
            out/TODOPOP-android.apk
          body: |
            **Windows:** download `TODOPOP-windows-setup.exe` and open it. If Windows says "Windows protected your PC", click **More info → Run anyway**.
            **Mac:** download `TODOPOP-mac.dmg`, open it and drag TODOPOP into Applications. The first time, open it from Applications; if macOS blocks it, go to **System Settings → Privacy & Security** and click **Open Anyway**.
            **Android phone:** download `TODOPOP-android.apk` on your phone and open it. If Android asks, allow your browser to install apps, then tap **Install**.
            **iPhone:** open https://todopop.app/app/ in Safari, then Share → Add to Home Screen.
            Then scan the code from the desktop app (third O → Get the phone app).
